# balenaCloud variables of the Ardennes fleet, managed with tools/balena_env.py.
#
# device: UUID, UUID prefix or name; null = the fleet's only device.
#
# One entry per (name, level, service):
#   value    what balena_env.py writes; null = not managed (the compose default applies)
#   default  docker-compose.yml default, for reference only
#   level    device | fleet
#   service  '*' = all services, or one compose service (e.g. isaacbot-amr-network)
#   secret   never stored here; set it from the menu ("Set a secret")
#
# Regenerate from docker-compose.yml with `balena_env.py init` (keeps your values).

fleet: g_potlog_radu/ardennes
device: null

variables:
  # --- Network uplink page (isaacbot-amr-network) ---
  - {name: ISAACBOT_AMR_NETWORK_ENABLE, value: null, default: 'true', level: device, service: isaacbot-amr-network}
  - {name: NETUI_PORT, value: null, default: '5080', level: device, service: isaacbot-amr-network}
  - {name: NETUI_USER, value: admin, default: root, level: device, service: isaacbot-amr-network}
  - {name: NETUI_PASSWORD, value: null, default: null, level: device, service: isaacbot-amr-network, secret: true}
  - {name: RUTX11_PASSWORD, value: null, default: null, level: device, service: isaacbot-amr-network, secret: true}
  - {name: RUTX11_HOST, value: null, default: 192.168.1.1, level: device, service: isaacbot-amr-network}
  - {name: RUTX11_USER, value: null, default: root, level: device, service: isaacbot-amr-network}
  - {name: UPLINK_IFACE, value: null, default: auto, level: device, service: isaacbot-amr-network}
  - {name: UPLINK_ZONE, value: null, default: wwan, level: device, service: isaacbot-amr-network}
  - {name: LAN_ZONE, value: null, default: lan, level: device, service: isaacbot-amr-network}
  - {name: CLIENT_NETS, value: null, default: lan WWAN, level: device, service: isaacbot-amr-network}
  # --- Zenoh session mode ---
  - {name: ISAACBOT_AMR_ZENOH_MODE_PLATFORM, value: peer, default: peer, level: device, service: isaacbot-amr-platform}
  - {name: ISAACBOT_AMR_ZENOH_MODE_ORCH, value: null, default: client, level: device, service: '*'}
  - {name: ISAACBOT_AMR_ZENOH_MODE_SENSORS, value: client, default: client, level: device, service: isaacbot-amr-sensors}
  - {name: ISAACBOT_AMR_ZENOH_MODE_VDA5050, value: null, default: client, level: device, service: '*'}
  # --- Platform ---
  - {name: ISAACBOT_AMR_PLATFORM_ENABLE, value: 'true', default: 'true', level: device, service: isaacbot-amr-platform}
  - {name: ISAACBOT_AMR_PLATFORM_FOXGLOVE_TOPIC_WHITELIST, value: '', default: null, level: device, service: isaacbot-amr-platform}
  - {name: ISAACBOT_AMR_PLATFORM_FOXGLOVE_SERVICE_WHITELIST, value: '', default: null, level: device, service: isaacbot-amr-platform}
  # --- Orchestrator ---
  - {name: ISAACBOT_AMR_ORCH_NAVIGATION, value: 'true', default: 'false', level: device, service: '*'}
  - {name: ISAACBOT_AMR_ORCH_MISSION_MANAGER, value: 'true', default: 'false', level: device, service: '*'}
  - {name: ISAACBOT_AMR_ORCH_DRIVE_MODE, value: 'true', default: 'true', level: device, service: '*'}
  - {name: ISAACBOT_AMR_ORCH_DRIVE_DEFAULT_MODE, value: assisted, default: assisted, level: device, service: '*'}
  - {name: ISAACBOT_AMR_ORCH_LOCALIZATION_SOURCE, value: indoor, default: null, level: device, service: '*'}
  - {name: ISAACBOT_AMR_ORCH_NAV_MAP, value: null, default: null, level: device, service: '*'}
  - {name: ISAACBOT_AMR_ORCH_NAV_USE_CAMERA, value: 'false', default: 'false', level: device, service: '*'}
  - {name: ISAACBOT_AMR_ORCH_AMCL_INITIAL_POSE_X, value: '0.0', default: null, level: device, service: '*'}
  - {name: ISAACBOT_AMR_ORCH_AMCL_INITIAL_POSE_Y, value: '0.0', default: null, level: device, service: '*'}
  - {name: ISAACBOT_AMR_ORCH_AMCL_INITIAL_POSE_YAW, value: '0.0', default: null, level: device, service: '*'}
  # --- Sensors ---
  - {name: ISAACBOT_AMR_SENSORS_ENABLE, value: 'true', default: 'false', level: device, service: isaacbot-amr-sensors}
  - {name: ISAACBOT_AMR_SENSORS_CAMERA_FPS, value: '15', default: '15', level: device, service: isaacbot-amr-sensors}
  - {name: ISAACBOT_AMR_SENSORS_CAMERA_DEPTH_PROFILE, value: 424x240, default: 424x240, level: device, service: isaacbot-amr-sensors}
  - {name: ISAACBOT_AMR_SENSORS_CAMERA_DEPTH_CLOUD, value: 'true', default: 'false', level: device, service: isaacbot-amr-sensors}
  - {name: ISAACBOT_AMR_SENSORS_CAMERA_FIDUCIALS, value: 'false', default: 'false', level: device, service: isaacbot-amr-sensors}
  - {name: ISAACBOT_AMR_SENSORS_CAMERA_FIDUCIALS_DECIMATE, value: '2.0', default: '2.0', level: device, service: isaacbot-amr-sensors}
  - {name: ISAACBOT_AMR_SENSORS_CAMERA_DETECTION, value: 'false', default: 'false', level: device, service: isaacbot-amr-sensors}
  - {name: ISAACBOT_AMR_SENSORS_CAMERA_DETECTION_MODEL, value: null, default: null, level: device, service: isaacbot-amr-sensors}
  - {name: ISAACBOT_AMR_SENSORS_CAMERA_DETECTION_GPU, value: 'false', default: 'false', level: device, service: isaacbot-amr-sensors}
  - {name: ISAACBOT_AMR_SENSORS_CAMERA_DETECTION_MAX_RATE, value: '3.0', default: '3.0', level: device, service: isaacbot-amr-sensors}
  - {name: ISAACBOT_AMR_SENSORS_CAMERA_DETECTION_LABELS, value: null, default: person, level: device, service: isaacbot-amr-sensors}
  - {name: ISAACBOT_AMR_SENSORS_PERSON_DETECTION, value: null, default: 'off', level: device, service: isaacbot-amr-sensors}
  - {name: ISAACBOT_AMR_SENSORS_TERRAIN, value: 'false', default: 'false', level: device, service: isaacbot-amr-sensors}
  # --- Drive interface ---
  - {name: ISAACBOT_AMR_UI_ENABLE, value: 'true', default: 'true', level: device, service: '*'}
  - {name: ISAACBOT_AMR_UI_PORT, value: '80', default: '5000', level: device, service: '*'}
  - {name: ISAACBOT_AMR_UI_USER, value: admin, default: isaacbot, level: device, service: '*'}
  - {name: ISAACBOT_AMR_UI_PASSWORD, value: null, default: null, level: device, service: '*', secret: true}
  - {name: ISAACBOT_AMR_UI_MAX_LINEAR, value: '1.0', default: '1.0', level: device, service: '*'}
  - {name: ISAACBOT_AMR_UI_MAX_ANGULAR, value: '1.0', default: '1.0', level: device, service: '*'}
  - {name: ISAACBOT_AMR_UI_MAX_RIM_SPEED, value: '1.7', default: '1.7', level: device, service: '*'}
  - {name: ISAACBOT_AMR_UI_TRACK_WIDTH, value: '1.0204', default: '1.0204', level: device, service: '*'}
  - {name: ISAACBOT_AMR_UI_EXPO_LINEAR, value: '0.3', default: '0.3', level: device, service: '*'}
  - {name: ISAACBOT_AMR_UI_EXPO_ANGULAR, value: '0.5', default: '0.5', level: device, service: '*'}
  - {name: ISAACBOT_AMR_UI_AUX_OUTPUT_NAMES, value: null, default: null, level: device, service: '*'}
  - {name: ISAACBOT_AMR_UI_AUX_INPUT_NAMES, value: null, default: null, level: device, service: '*'}
  # --- VDA 5050 ---
  - {name: ISAACBOT_AMR_VDA5050_ENABLE, value: 'true', default: 'false', level: device, service: '*'}
  - {name: ISAACBOT_AMR_VDA5050_LOCAL_BROKER, value: 'false', default: 'true', level: device, service: '*'}
  - {name: ISAACBOT_AMR_VDA5050_BROKER_HOST, value: 10.8.0.1, default: 127.0.0.1, level: device, service: '*'}
  - {name: ISAACBOT_AMR_VDA5050_BROKER_PORT, value: '1883', default: '1883', level: device, service: '*'}
  - {name: ISAACBOT_AMR_VDA5050_BROKER_USER, value: ardennes, default: null, level: device, service: '*'}
  - {name: ISAACBOT_AMR_VDA5050_BROKER_PASSWORD, value: null, default: null, level: device, service: '*', secret: true}
  - {name: ISAACBOT_AMR_VDA5050_BROKER_TLS, value: 'false', default: auto, level: device, service: '*'}
  - {name: ISAACBOT_AMR_VDA5050_MANUFACTURER, value: MechatronicsAcademy, default: MechatronicsAcademy, level: device, service: '*'}
  - {name: ISAACBOT_AMR_VDA5050_SERIAL_NUMBER, value: ardennes, default: ardennes, level: device, service: '*'}
  - {name: ISAACBOT_AMR_VDA5050_MAP_FRAME, value: null, default: null, level: device, service: '*'}
